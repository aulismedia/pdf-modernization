<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Review — {{ project.title }}</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #1a1a1a; color: #ddd;
  font-family: 'SF Mono', Consolas, monospace; font-size: 13px;
  height: 100vh; display: flex; flex-direction: column; overflow: hidden;
}

#toolbar {
  background: #252525; border-bottom: 1px solid #3a3a3a;
  padding: 0 16px; display: flex; align-items: center; gap: 12px;
  height: 46px; flex-shrink: 0;
}
#back-btn {
  color: #555; font-size: 12px; text-decoration: none;
  padding: 4px 8px; border-radius: 3px;
  transition: color 0.1s, background 0.1s;
}
#back-btn:hover { color: #aaa; background: #333; }
#toolbar-sep { color: #3a3a3a; }
#toolbar-title { color: #666; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
#page-label { color: #fff; font-weight: bold; min-width: 130px; }
#rotate-btn {
  width: 30px; height: 30px; padding: 0;
  background: #333; color: #aaa;
  border: 1px solid #444; border-radius: 4px; cursor: pointer;
  font-size: 16px; line-height: 1; display: flex; align-items: center; justify-content: center;
  transition: background 0.15s, color 0.15s;
}
#rotate-btn:hover { background: #444; color: #ddd; }
#ignore-btn {
  padding: 5px 20px; background: #444; color: #aaa;
  border: none; border-radius: 4px; cursor: pointer;
  font-weight: bold; font-size: 12px; font-family: inherit;
  transition: background 0.15s, color 0.15s;
}
#ignore-btn:hover { background: #555; color: #ddd; }
#ignore-btn.active { background: #c0392b; color: #fff; }
#ignore-btn.active:hover { background: #a93226; }
#status { margin-left: auto; color: #777; font-size: 12px; }

#main {
  flex: 1; display: flex; overflow: hidden;
}
#editor {
  flex: 1; overflow: auto;
  display: flex; justify-content: center; align-items: center;
  padding: 20px; background: #141414;
}
#canvas-wrap { position: relative; display: inline-block; line-height: 0; flex-shrink: 0; }
#page-img { display: block; }
#svg-overlay { position: absolute; top: 0; left: 0; pointer-events: none; overflow: visible; }

#info-panel {
  width: 380px; flex-shrink: 0;
  background: #1e1e1e; border-left: 1px solid #333;
  display: flex; flex-direction: column; overflow: hidden;
}
#info-header {
  padding: 10px 14px; background: #252525; border-bottom: 1px solid #333;
  font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: 1px;
  display: flex; align-items: center;
}
#info-id   { color: #fff; font-weight: bold; }
#info-type { color: #aaa; margin-left: 8px; }
#delete-btn {
  display: none; margin-left: auto;
  padding: 3px 10px; background: #4a1010; border: 1px solid #7a2020;
  border-radius: 3px; color: #c87070; cursor: pointer;
  font-size: 11px; font-family: inherit;
  transition: background 0.1s, color 0.1s;
}
#delete-btn:hover { background: #7a1515; color: #f09090; }
#info-text {
  flex: 1; overflow-y: auto; padding: 14px;
  white-space: pre-wrap; font-size: 13px; line-height: 1.6; color: #ccc;
  background: transparent; border: none; outline: none;
  resize: none; width: 100%; font-family: 'SF Mono', Consolas, monospace;
}
#info-text:focus { background: #111; }
#info-text::placeholder { color: #555; font-style: italic; }
#info-text:read-only { color: #555; font-style: italic; cursor: default; }
#add-area-panel {
  padding: 10px 14px; border-top: 1px solid #2a2a2a;
  display: flex; gap: 6px; flex-wrap: wrap;
}
#add-illus-btn {
  flex: 1; padding: 7px 10px; background: #0d2b0d; border: 1px solid #1e5c1e;
  border-radius: 4px; color: #6bbf6b; cursor: pointer;
  font-size: 12px; font-family: inherit;
  transition: background 0.1s, color 0.1s;
}
#add-illus-btn:hover { background: #163d16; color: #88d488; }
#add-illus-btn.drawing { background: #1e5c1e; color: #adf0ad; border-color: #4CAF50; }
#delete-all-btn {
  flex: 1; padding: 7px 10px; background: #2b0d0d; border: 1px solid #5c1e1e;
  border-radius: 4px; color: #bf6b6b; cursor: pointer;
  font-size: 12px; font-family: inherit;
  transition: background 0.1s, color 0.1s;
}
#delete-all-btn:hover { background: #3d1616; color: #d48888; }
#opus-btn {
  flex: 1; padding: 7px 10px; background: #1a2a3a; color: #5b9bd5;
  border: 1px solid #2a4a6a; border-radius: 4px; cursor: pointer;
  font-size: 12px; font-family: inherit;
  transition: background 0.15s, color 0.15s;
}
#opus-btn:hover { background: #233a52; color: #7ab8f0; }
#opus-btn:disabled { opacity: 0.5; cursor: default; }
#sonnet-btn {
  flex: 1; padding: 7px 10px; background: #1a2a3a; color: #5bd5a0;
  border: 1px solid #2a6a4a; border-radius: 4px; cursor: pointer;
  font-size: 12px; font-family: inherit;
  transition: background 0.15s, color 0.15s;
}
#sonnet-btn:hover { background: #233a30; color: #7af0c0; }
#sonnet-btn:disabled { opacity: 0.5; cursor: default; }
#process-later-btn {
  flex: 0 0 100%; padding: 7px 10px; background: #1e1800; color: #b8852a;
  border: 1px solid #5a4200; border-radius: 4px; cursor: pointer;
  font-size: 12px; font-family: inherit;
  transition: background 0.15s, color 0.15s;
}
#process-later-btn:hover { background: #2e2400; color: #d4a040; }
#process-later-btn.active { background: #8a6010; color: #ffe0a0; border-color: #c89030; }
#process-later-btn.active:hover { background: #9e7020; }

#filmstrip {
  height: 50px; background: #0f0f0f; border-top: 1px solid #2a2a2a;
  display: flex; align-items: center; overflow-x: auto;
  padding: 0 12px; gap: 3px; flex-shrink: 0;
}
#filmstrip::-webkit-scrollbar { height: 4px; }
#filmstrip::-webkit-scrollbar-thumb { background: #333; }
.pg {
  padding: 5px 11px; background: #222; border: 1px solid #3a3a3a;
  color: #999; cursor: pointer; border-radius: 3px;
  font-size: 12px; font-family: monospace; flex-shrink: 0;
  transition: background 0.1s, color 0.1s;
}
.pg:hover { background: #333; color: #eee; }
.pg.active { background: #0d6efd; border-color: #0d6efd; color: #fff; }
.pg.ignored { opacity: 0.45; }
.pg.ignored.active { opacity: 1; background: #c0392b; border-color: #e74c3c; }
.pg.prohibited { background: #3a0e0e; border-color: #7a2020; color: #c87070; }
.pg.prohibited:hover { background: #4d1414; color: #e08080; }
.pg.prohibited.active { background: #c0392b; border-color: #e74c3c; color: #fff; }
.pg.process-later { background: #1e1800; border-color: #5a4200; color: #b8852a; }
.pg.process-later:hover { background: #2e2400; color: #d4a040; }
.pg.process-later.active { background: #8a6010; border-color: #c89030; color: #fff; }
.pg.filtered-out { display: none; }
.pg.opus-processed { background: #0e1a2e; border-color: #1e4a8a; color: #5c9ad4; }
.pg.opus-processed:hover { background: #142240; color: #7ab8f0; }
.pg.opus-processed.active { background: #1565c0; border-color: #1e88e5; color: #fff; }

#opus-filter-badge {
  display: none; padding: 3px 10px; border-radius: 3px;
  background: #0e1a2e; border: 1px solid #1e4a8a; color: #5c9ad4;
  font-size: 11px; white-space: nowrap;
}

#type-switcher {
  display: none; padding: 7px 14px; gap: 5px;
  border-bottom: 1px solid #2a2a2a; flex-wrap: wrap;
}
#type-switcher.visible { display: flex; }
.type-btn {
  padding: 3px 9px; border: 1px solid #3a3a3a; border-radius: 3px;
  background: #252525; color: #666; cursor: pointer;
  font-size: 11px; font-family: inherit;
  transition: background 0.1s, color 0.1s, border-color 0.1s;
}
.type-btn:hover { background: #333; color: #ccc; }
.type-btn.active {
  border-color: var(--type-color, #888); color: var(--type-color, #ccc); background: #1a1a1a;
}

/* no-areas notice */
#no-areas-notice {
  display: none; padding: 12px 14px; margin: 0;
  background: #1a1a00; border-bottom: 1px solid #3a3a00; color: #888;
  font-size: 11px; text-align: center;
}
</style>
</head>
<body>

<div id="toolbar">
  <a id="back-btn" href="/projects/{{ project.id }}">← Back</a>
  <span id="toolbar-sep">|</span>
  <span id="toolbar-title">{{ project.title }}</span>
  <span id="page-label">—</span>
  <span id="opus-filter-badge">Opus Review</span>
  <button id="rotate-btn" onclick="rotatePage()">↺</button>
  <button id="ignore-btn" onclick="toggleIgnore()">Ignore Page</button>
  <span id="status">Select a page from the filmstrip</span>
</div>

<div id="main">
  <div id="editor">
    <div id="canvas-wrap">
      <img id="page-img" src="" alt="">
      <svg id="svg-overlay"></svg>
    </div>
  </div>
  <div id="info-panel">
    <div id="no-areas-notice">Areas not yet detected — only page ignore is available</div>
    <div id="info-header">
      <span id="info-id">—</span><span id="info-type"></span>
      <button id="delete-btn" onclick="deleteArea()">Delete</button>
    </div>
    <div id="type-switcher">
      <button class="type-btn" data-type="main_text"            onclick="setAreaType('main_text')">main_text</button>
      <button class="type-btn" data-type="chapter_title"        onclick="setAreaType('chapter_title')">chapter_title</button>
      <button class="type-btn" data-type="subtitle"             onclick="setAreaType('subtitle')">subtitle</button>
      <button class="type-btn" data-type="header"               onclick="setAreaType('header')">header</button>
      <button class="type-btn" data-type="footer"               onclick="setAreaType('footer')">footer</button>
      <button class="type-btn" data-type="illustration"         onclick="setAreaType('illustration')">illustration</button>
      <button class="type-btn" data-type="illustration_caption" onclick="setAreaType('illustration_caption')">illustration_caption</button>
      <button class="type-btn" data-type="table"               onclick="setAreaType('table')">table</button>
      <button class="type-btn" data-type="footnote"             onclick="setAreaType('footnote')">footnote</button>
    </div>
    <textarea id="info-text" placeholder="Click an area to see its text" readonly></textarea>
    <div id="table-html-preview" style="display:none; margin-top:8px;">
      <div style="font-size:11px; color:#888; margin-bottom:4px; text-transform:uppercase; letter-spacing:0.05em;">HTML Preview</div>
      <iframe id="table-preview-frame" srcdoc="" style="width:100%; height:180px; border:1px solid #333; background:#fff; border-radius:3px;"></iframe>
    </div>
    <div id="add-area-panel">
      <button id="add-illus-btn" onclick="toggleDrawMode()">+ Add area</button>
      <button id="delete-all-btn" onclick="deleteAllAreas()">Delete all</button>
      <button id="opus-btn" onclick="redetectWithOpus()" disabled>Try Opus</button>
      <button id="sonnet-btn" onclick="redetectWithSonnet()" disabled>Try Sonnet</button>
      <button id="process-later-btn" onclick="toggleProcessLater()">Process later</button>
    </div>
  </div>
</div>

<div id="filmstrip"></div>

<script>
const BASE = '/projects/{{ project.id }}';

const COLORS = {
  main_text:            '#4CAF50',
  illustration:         '#2196F3',
  illustration_caption: '#00BCD4',
  table:                '#009688',
  footnote:             '#FF9800',
  header:               '#F44336',
  footer:               '#EF6C00',
  page_number:          '#AB47BC',
  chapter_title:        '#E91E63',
  subtitle:             '#FF5722',
  decoration:           '#757575',
};
const DEFAULT_COLOR = '#FFEB3B';

const img       = document.getElementById('page-img');
const svg       = document.getElementById('svg-overlay');

let pages = [], currentIdx = -1, pageData = null, scale = 1, selectedAreaIdx = -1;
let hasAreas = false;
let visibleIdxs = null; // null = no filter; array of page indices when filtering

const FILTER_OPUS = new URLSearchParams(location.search).get('filter') === 'opus';

function showTypeSwitcher(type) {
  const sw = document.getElementById('type-switcher');
  sw.classList.add('visible');
  sw.querySelectorAll('.type-btn').forEach(btn => {
    const active = btn.dataset.type === type;
    btn.classList.toggle('active', active);
    btn.style.setProperty('--type-color', active ? (COLORS[type] || '#888') : '');
  });
}

function setAreaType(type) {
  if (selectedAreaIdx < 0 || !pageData) return;
  pageData.areas[selectedAreaIdx].type = type;
  renderSVG();
  selectArea(selectedAreaIdx);
  savePage();
}

// ── Fit image ─────────────────────────────────────────────────────────────────

function fitImage() {
  if (!pageData) return;
  const TOOLBAR   = 46;
  const FILMSTRIP = 50;
  const PAD       = 24;
  const HANDLE_R  = 10;
  const INFO_W    = 380;
  const availW = window.innerWidth  - INFO_W - PAD * 2 - HANDLE_R * 2;
  const availH = window.innerHeight - TOOLBAR - FILMSTRIP - PAD * 2 - HANDLE_R * 2;
  const rot = pageData.rotation || 0;
  const nw = (rot === 90 || rot === 270) ? pageData.page_dimensions.height : pageData.page_dimensions.width;
  const nh = (rot === 90 || rot === 270) ? pageData.page_dimensions.width  : pageData.page_dimensions.height;
  scale = Math.min(availW / nw, availH / nh);
  const dispW = Math.round(nw * scale);
  const dispH = Math.round(nh * scale);
  img.style.width  = dispW + 'px';
  img.style.height = dispH + 'px';
  svg.style.width  = dispW + 'px';
  svg.style.height = dispH + 'px';
}

window.addEventListener('resize', () => { fitImage(); renderSVG(); });

// ── Init ──────────────────────────────────────────────────────────────────────

async function init() {
  const r = await fetch(`${BASE}/api/book`);
  const b = await r.json();
  pages    = b.pages;
  hasAreas = !!b.has_areas;

  if (!hasAreas) {
    document.getElementById('no-areas-notice').style.display = 'block';
    document.getElementById('add-area-panel').style.display  = 'none';
  }

  const strip = document.getElementById('filmstrip');
  pages.forEach((p, i) => {
    const num = p.name.replace(/\D/g, '').replace(/^0+/, '') || String(i + 1);
    const btn = document.createElement('button');
    btn.className = 'pg';
    btn.id        = 'pg' + i;
    btn.textContent = num;
    btn.onclick   = () => loadPage(i);
    if (p.prohibited)    btn.classList.add('prohibited');
    if (p.ignored)       btn.classList.add('ignored');
    if (p.process_later) btn.classList.add('process-later');
    const isOpusLater = (p.detected_by || '').startsWith('opus:later:');
    if (isOpusLater) btn.classList.add('opus-processed');
    strip.appendChild(btn);
  });

  if (FILTER_OPUS) {
    visibleIdxs = pages
      .map((p, i) => ({ p, i }))
      .filter(({ p }) => (p.detected_by || '').startsWith('opus:later:'))
      .map(({ i }) => i);

    pages.forEach((_, i) => {
      if (!visibleIdxs.includes(i)) {
        const btn = document.getElementById('pg' + i);
        if (btn) btn.classList.add('filtered-out');
      }
    });

    const badge = document.getElementById('opus-filter-badge');
    badge.style.display = 'inline-block';
    badge.textContent   = `Opus Review — ${visibleIdxs.length} page${visibleIdxs.length !== 1 ? 's' : ''}`;
  }

  // Auto-load first visible page
  if (visibleIdxs !== null) {
    if (visibleIdxs.length > 0) {
      loadPage(visibleIdxs[0]);
    } else {
      setStatus('No Opus-processed pages yet — run the Opus batch first.');
    }
  } else {
    const firstIdx = pages.findIndex(p => !p.ignored);
    loadPage(firstIdx >= 0 ? firstIdx : 0);
  }
}

// ── Load page ─────────────────────────────────────────────────────────────────

async function loadPage(idx) {
  if (idx < 0 || idx >= pages.length) return;
  currentIdx = idx;

  document.querySelectorAll('.pg').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('pg' + idx);
  if (btn) { btn.classList.add('active'); btn.scrollIntoView({ inline: 'nearest', block: 'nearest' }); }

  document.getElementById('page-label').textContent = pages[idx].name;
  setStatus('Loading…');

  const r = await fetch(`${BASE}/api/page/` + encodeURIComponent(pages[idx].name));
  pageData = await r.json();

  selectedAreaIdx = -1;
  document.getElementById('ignore-btn').className          = '';
  document.getElementById('process-later-btn').className   = '';
  document.getElementById('opus-btn').disabled             = true;
  document.getElementById('sonnet-btn').disabled           = true;
  document.getElementById('info-id').textContent   = '—';
  document.getElementById('info-id').style.color   = '';
  document.getElementById('info-type').textContent = '';
  document.getElementById('type-switcher').classList.remove('visible');
  const ib = document.getElementById('info-text');
  ib.value = ''; ib.placeholder = 'Click an area to see its text'; ib.readOnly = true;
  document.getElementById('delete-btn').style.display = 'none';
  exitDrawMode();
  svg.innerHTML = '';

  img.onload = () => {
    fitImage();
    renderSVG();
    document.getElementById('ignore-btn').className        = pageData.ignored       ? 'active' : '';
    document.getElementById('process-later-btn').className = pageData.process_later ? 'active' : '';
    if (hasAreas) document.getElementById('opus-btn').disabled = false;
    if (hasAreas) document.getElementById('sonnet-btn').disabled = false;
    const acount = (pageData.areas || []).length;
    setStatus(acount > 0
      ? acount + ' areas  ·  click area to inspect  ·  drag handles to edit'
      : (hasAreas ? '0 areas on this page' : 'No areas — use Ignore to skip this page'));
  };
  const originalSrc = `${BASE}/images/` + pages[idx].name;
  const rot = pageData.rotation || 0;
  if (rot) {
    applyCanvasRotation(originalSrc, rot).then(src => { img.src = src; });
  } else {
    img.src = originalSrc;
  }
}

// ── Render SVG ────────────────────────────────────────────────────────────────

function renderSVG() {
  svg.innerHTML = '';

  const cb = pageData.content_bbox;
  if (cb) {
    const bCorners = [[cb.left,cb.top],[cb.right,cb.top],[cb.right,cb.bottom],[cb.left,cb.bottom]].map(([x,y]) => rotPt(x,y));
    const bXs = bCorners.map(p=>p[0]), bYs = bCorners.map(p=>p[1]);
    const rect = el('rect');
    rect.setAttribute('x',                Math.min(...bXs) * scale);
    rect.setAttribute('y',                Math.min(...bYs) * scale);
    rect.setAttribute('width',            (Math.max(...bXs) - Math.min(...bXs)) * scale);
    rect.setAttribute('height',           (Math.max(...bYs) - Math.min(...bYs)) * scale);
    rect.setAttribute('fill',             'none');
    rect.setAttribute('stroke',           '#e67e22');
    rect.setAttribute('stroke-width',     '2');
    rect.setAttribute('stroke-dasharray', '8 4');
    rect.setAttribute('pointer-events',   'none');
    svg.appendChild(rect);

    const BBOX_COLOR = '#e67e22';
    const bboxEdges = [
      { x: (cb.left+cb.right)/2,  y: cb.top,              prop: 'top',    axis: 'y', cursor: 'ns-resize' },
      { x: cb.right,               y: (cb.top+cb.bottom)/2, prop: 'right',  axis: 'x', cursor: 'ew-resize' },
      { x: (cb.left+cb.right)/2,  y: cb.bottom,            prop: 'bottom', axis: 'y', cursor: 'ns-resize' },
      { x: cb.left,                y: (cb.top+cb.bottom)/2, prop: 'left',   axis: 'x', cursor: 'ew-resize' },
    ];
    bboxEdges.forEach(({ x, y, prop, axis, cursor }) => {
      const h = el('circle');
      h.setAttribute('cx', x * scale); h.setAttribute('cy', y * scale); h.setAttribute('r', 5);
      h.setAttribute('fill', 'rgba(255,255,255,0.5)');
      h.setAttribute('stroke', BBOX_COLOR); h.setAttribute('stroke-width', '1.5');
      h.style.cssText = `cursor:${cursor};pointer-events:all`;
      makeBboxEdgeDraggable(h, prop, axis);
      svg.appendChild(h);
    });

    const bboxCorners = [
      { x: cb.left,  y: cb.top,    xp: 'left',  yp: 'top',    cursor: 'nwse-resize' },
      { x: cb.right, y: cb.top,    xp: 'right', yp: 'top',    cursor: 'nesw-resize' },
      { x: cb.right, y: cb.bottom, xp: 'right', yp: 'bottom', cursor: 'nwse-resize' },
      { x: cb.left,  y: cb.bottom, xp: 'left',  yp: 'bottom', cursor: 'nesw-resize' },
    ];
    bboxCorners.forEach(({ x, y, xp, yp, cursor }) => {
      const h = el('circle');
      h.setAttribute('cx', x * scale); h.setAttribute('cy', y * scale); h.setAttribute('r', 7);
      h.setAttribute('fill', '#ffffff');
      h.setAttribute('stroke', BBOX_COLOR); h.setAttribute('stroke-width', '2.5');
      h.style.cssText = `cursor:${cursor};pointer-events:all`;
      makeBboxCornerDraggable(h, xp, yp);
      svg.appendChild(h);
    });
  }

  (pageData.areas || []).forEach((area, ai) => {
    const c   = COLORS[area.type] || DEFAULT_COLOR;
    const pts = area.polygon;
    const displayPts = pts.map(([x, y]) => rotPt(x, y));
    const npts = normalizeQuad(displayPts);
    const isSelected = ai === selectedAreaIdx;

    const poly = el('polygon');
    poly.setAttribute('points', displayPts.map(([x, y]) => x * scale + ',' + y * scale).join(' '));
    poly.setAttribute('fill',         c);
    poly.setAttribute('fill-opacity', isSelected ? '0.28' : '0.12');
    poly.setAttribute('stroke',       c);
    poly.setAttribute('stroke-width', isSelected ? '3' : '2');
    poly.setAttribute('stroke-opacity', '0.9');
    poly.style.cssText = 'cursor:pointer;pointer-events:all';
    poly.addEventListener('click', e => { e.stopPropagation(); if (!drawMode) selectArea(ai); });
    svg.appendChild(poly);

    const [lx, ly] = centroid(displayPts);
    const lbl = el('text');
    lbl.setAttribute('x', lx * scale);
    lbl.setAttribute('y', ly * scale);
    lbl.setAttribute('text-anchor',       'middle');
    lbl.setAttribute('dominant-baseline', 'middle');
    lbl.setAttribute('fill',              c);
    lbl.setAttribute('font-size',         '11');
    lbl.setAttribute('font-family',       'monospace');
    lbl.setAttribute('pointer-events',    'none');
    lbl.textContent = area.id + '  ' + area.type;
    svg.appendChild(lbl);

    const normToOrig = npts.map(np => displayPts.findIndex(p => p === np));
    const [n0, n1, n2, n3] = normToOrig;
    // For 90°/270° rotation, horizontal (ns-resize) edges modify original x, vertical modify original y.
    const swapXY = (pageData.rotation === 90 || pageData.rotation === 270);
    const nsAxis = swapXY ? 0 : 1;
    const ewAxis = swapXY ? 1 : 0;

    const edges = [
      { mx: (npts[0][0]+npts[1][0])/2, my: npts[0][1],               axis: nsAxis, vis: [n0,n1], cursor: 'ns-resize' },
      { mx: npts[1][0],                my: (npts[1][1]+npts[2][1])/2, axis: ewAxis, vis: [n1,n2], cursor: 'ew-resize' },
      { mx: (npts[2][0]+npts[3][0])/2, my: npts[2][1],               axis: nsAxis, vis: [n2,n3], cursor: 'ns-resize' },
      { mx: npts[0][0],                my: (npts[0][1]+npts[3][1])/2, axis: ewAxis, vis: [n0,n3], cursor: 'ew-resize' },
    ];
    edges.forEach(({ mx, my, axis, vis, cursor }) => {
      const h = el('circle');
      h.setAttribute('cx', mx * scale);
      h.setAttribute('cy', my * scale);
      h.setAttribute('r',  5);
      h.setAttribute('fill',         'rgba(255,255,255,0.5)');
      h.setAttribute('stroke',       c);
      h.setAttribute('stroke-width', '1.5');
      h.style.cssText = `cursor:${cursor};pointer-events:all`;
      makeEdgeDraggable(h, ai, axis, vis);
      svg.appendChild(h);
    });

    // xv = vertices whose original-x changes when dragging; yv = vertices whose original-y changes.
    // With 90°/270° rotation the screen drag axes map to opposite original axes, so xv/yv swap.
    const corners = swapXY ? [
      { vi: n0, xv: [n0,n1], yv: [n0,n3], cursor: 'nwse-resize' },
      { vi: n1, xv: [n0,n1], yv: [n1,n2], cursor: 'nesw-resize' },
      { vi: n2, xv: [n2,n3], yv: [n1,n2], cursor: 'nwse-resize' },
      { vi: n3, xv: [n2,n3], yv: [n0,n3], cursor: 'nesw-resize' },
    ] : [
      { vi: n0, xv: [n0,n3], yv: [n0,n1], cursor: 'nwse-resize' },
      { vi: n1, xv: [n1,n2], yv: [n0,n1], cursor: 'nesw-resize' },
      { vi: n2, xv: [n1,n2], yv: [n2,n3], cursor: 'nwse-resize' },
      { vi: n3, xv: [n0,n3], yv: [n2,n3], cursor: 'nesw-resize' },
    ];
    corners.forEach(({ vi, xv, yv, cursor }) => {
      const [vx, vy] = displayPts[vi];
      const h = el('circle');
      h.setAttribute('cx', vx * scale);
      h.setAttribute('cy', vy * scale);
      h.setAttribute('r',  7);
      h.setAttribute('fill',         '#ffffff');
      h.setAttribute('stroke',       c);
      h.setAttribute('stroke-width', '2.5');
      h.style.cssText = `cursor:${cursor};pointer-events:all`;
      makeCornerDraggable(h, ai, xv, yv);
      svg.appendChild(h);
    });
  });
}

// ── Drag ──────────────────────────────────────────────────────────────────────

function makeEdgeDraggable(handle, areaIdx, axis, vertexIndices) {
  handle.addEventListener('mousedown', e => {
    e.preventDefault(); e.stopPropagation();
    const poly   = pageData.areas[areaIdx].polygon;
    const startX = e.clientX, startY = e.clientY;
    const orig   = vertexIndices.map(vi => poly[vi][axis]);
    const rot    = pageData.rotation || 0;
    function onMove(e) {
      const [odx, ody] = dragToOriginal((e.clientX - startX) / scale, (e.clientY - startY) / scale, rot);
      const delta = axis === 0 ? odx : ody;
      vertexIndices.forEach((vi, k) => { poly[vi][axis] = Math.round(orig[k] + delta); });
      renderSVG();
    }
    function onUp() {
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup',   onUp);
      savePage();
    }
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup',   onUp);
  });
}

function makeCornerDraggable(handle, areaIdx, xVertices, yVertices) {
  handle.addEventListener('mousedown', e => {
    e.preventDefault(); e.stopPropagation();
    const poly   = pageData.areas[areaIdx].polygon;
    const startX = e.clientX, startY = e.clientY;
    const origX  = xVertices.map(vi => poly[vi][0]);
    const origY  = yVertices.map(vi => poly[vi][1]);
    const rot    = pageData.rotation || 0;
    function onMove(e) {
      const [dx, dy] = dragToOriginal((e.clientX - startX) / scale, (e.clientY - startY) / scale, rot);
      xVertices.forEach((vi, k) => { poly[vi][0] = Math.round(origX[k] + dx); });
      yVertices.forEach((vi, k) => { poly[vi][1] = Math.round(origY[k] + dy); });
      renderSVG();
    }
    function onUp() {
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup',   onUp);
      savePage();
    }
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup',   onUp);
  });
}

// ── Bbox drag ─────────────────────────────────────────────────────────────────

function makeBboxEdgeDraggable(handle, prop, axis) {
  handle.addEventListener('mousedown', e => {
    e.preventDefault(); e.stopPropagation();
    const cb = pageData.content_bbox;
    const start = axis === 'x' ? e.clientX : e.clientY;
    const orig  = cb[prop];
    function onMove(e) {
      cb[prop] = Math.round(orig + ((axis === 'x' ? e.clientX : e.clientY) - start) / scale);
      renderSVG();
    }
    function onUp() {
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup',   onUp);
      saveBbox();
    }
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup',   onUp);
  });
}

function makeBboxCornerDraggable(handle, xp, yp) {
  handle.addEventListener('mousedown', e => {
    e.preventDefault(); e.stopPropagation();
    const cb = pageData.content_bbox;
    const startX = e.clientX, startY = e.clientY;
    const origX = cb[xp], origY = cb[yp];
    function onMove(e) {
      cb[xp] = Math.round(origX + (e.clientX - startX) / scale);
      cb[yp] = Math.round(origY + (e.clientY - startY) / scale);
      renderSVG();
    }
    function onUp() {
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup',   onUp);
      saveBbox();
    }
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup',   onUp);
  });
}

function enterDrawMode() {
  drawMode = true;

function exitDrawMode() {
  drawMode = false; drawStart = null;
  canvasWrap.style.cursor = '';

  if (btn) btn.classList.remove('drawing');
  const preview = document.getElementById('draw-preview');

canvasWrap.addEventListener('mousedown', e => {
  if (!drawMode) return;
  e.preventDefault(); e.stopPropagation();
  const r = canvasWrap.getBoundingClientRect();
  drawStart = {
    x: Math.round((e.clientX - r.left) / scale),
    y: Math.round((e.clientY - r.top)  / scale),
  };
});

canvasWrap.addEventListener('mousemove', e => {
  if (!drawMode || !drawStart) return;
  const r  = canvasWrap.getBoundingClientRect();
  const cx = Math.round((e.clientX - r.left) / scale);
  const cy = Math.round((e.clientY - r.top)  / scale);
  let preview = document.getElementById('draw-preview');
  if (!preview) {
    preview = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    preview.id = 'draw-preview';
    preview.setAttribute('fill',             COLORS.illustration);
    preview.setAttribute('fill-opacity',     '0.18');
    preview.setAttribute('stroke',           COLORS.illustration);
    preview.setAttribute('stroke-width',     '2');
    preview.setAttribute('stroke-dasharray', '6,3');
    preview.setAttribute('pointer-events',   'none');
    svg.appendChild(preview);
  }
  const x1 = Math.min(drawStart.x, cx) * scale;
  const y1 = Math.min(drawStart.y, cy) * scale;
  preview.setAttribute('x',      x1);
  preview.setAttribute('y',      y1);
  preview.setAttribute('width',  Math.abs(cx - drawStart.x) * scale);
  preview.setAttribute('height', Math.abs(cy - drawStart.y) * scale);
});

window.addEventListener('mouseup', e => {
  if (!drawMode || !drawStart) return;
  const r  = canvasWrap.getBoundingClientRect();
  const cx = Math.round((e.clientX - r.left) / scale);
  const cy = Math.round((e.clientY - r.top)  / scale);
  const x1 = Math.min(drawStart.x, cx), y1 = Math.min(drawStart.y, cy);
  const x2 = Math.max(drawStart.x, cx), y2 = Math.max(drawStart.y, cy);
  exitDrawMode();
  if (x2 - x1 > 5 && y2 - y1 > 5) {
    const maxN = (pageData.areas || []).reduce((m, a) => {
      const n = parseInt((a.id || '').replace('area_', ''), 10);
      return isNaN(n) ? m : Math.max(m, n);
    }, 0);
    const maxIllus = (pageData.areas || []).reduce((m, a) => {
      const n = parseInt((a.illustration_id || '').replace('illus_', ''), 10);
      return isNaN(n) ? m : Math.max(m, n);
    }, 0);
    pageData.areas.push({
      id: 'area_' + String(maxN + 1).padStart(3, '0'),
      type: 'illustration',
      polygon: [[x1,y1],[x2,y1],[x2,y2],[x1,y2]],
      text: null, illustration_id: 'illus_' + String(maxIllus + 1).padStart(3, '0'), linked_illustration_id: null,
    });
    renderSVG();
    savePage();
    selectArea(pageData.areas.length - 1);
  }
});

// ── Rotation helpers ──────────────────────────────────────────────────────────

function rotPt(x, y) {
  const rot = pageData.rotation || 0;
  const W = pageData.page_dimensions.width;
  const H = pageData.page_dimensions.height;
  switch (rot) {
    case 90:  return [y, W - x];
    case 180: return [W - x, H - y];
    case 270: return [H - y, x];
    default:  return [x, y];
  }
}

// Convert a screen-space drag delta to original (unrotated) coord-space delta.
function dragToOriginal(sdx, sdy, rot) {
  switch (rot) {
    case 90:  return [-sdy,  sdx];
    case 180: return [-sdx, -sdy];
    case 270: return [ sdy, -sdx];
    default:  return [ sdx,  sdy];
  }
}

function applyCanvasRotation(src, rotation) {
  return new Promise(resolve => {
    const image = new Image();
    image.onload = () => {
      const W = image.naturalWidth, H = image.naturalHeight;
      const canvas = document.createElement('canvas');
      if (rotation === 90 || rotation === 270) { canvas.width = H; canvas.height = W; }
      else { canvas.width = W; canvas.height = H; }
      const ctx = canvas.getContext('2d');
      ctx.translate(canvas.width / 2, canvas.height / 2);
      ctx.rotate(-rotation * Math.PI / 180);
      ctx.drawImage(image, -W / 2, -H / 2);
      resolve(canvas.toDataURL('image/jpeg', 0.92));
    };
    image.src = src;
  });
}

async function saveRotation() {
  if (!pageData) return;
  await fetch(`${BASE}/api/page/` + encodeURIComponent(pageData.source_image) + '/rotation', {
    method:  'POST',
    headers: { 'Content-Type': 'application/json' },
    body:    JSON.stringify({ rotation: pageData.rotation || 0 }),
  });
}

async function rotatePage() {
  if (!pageData) return;
  pageData.rotation = ((pageData.rotation || 0) + 90) % 360;
  await saveRotation();
  const src = `${BASE}/images/` + pages[currentIdx].name;
  const rot = pageData.rotation;
  if (rot) {
    applyCanvasRotation(src, rot).then(rotSrc => { img.src = rotSrc; });
  } else {
    img.src = src;
  }
}

function el(tag) { return document.createElementNS('http://www.w3.org/2000/svg', tag); }
// Return a view of pts reordered as [top-left, top-right, bottom-right, bottom-left]
// so edge/corner handle logic works regardless of which corner the AI started from.
function normalizeQuad(pts) {
  if (pts.length !== 4) return pts;
  const cx = pts.reduce((s, p) => s + p[0], 0) / 4;
  const cy = pts.reduce((s, p) => s + p[1], 0) / 4;
  const tl = pts.find(p => p[0] <= cx && p[1] <= cy);
  const tr = pts.find(p => p[0] >  cx && p[1] <= cy);
  const br = pts.find(p => p[0] >  cx && p[1] >  cy);
  const bl = pts.find(p => p[0] <= cx && p[1] >  cy);
  if (!tl || !tr || !br || !bl) return pts;
  return [tl, tr, br, bl];
}
function centroid(pts) {
  return [
    pts.reduce((s, p) => s + p[0], 0) / pts.length,
    pts.reduce((s, p) => s + p[1], 0) / pts.length,
  ];
}
function setStatus(m) { document.getElementById('status').textContent = m; }

// ── Opus re-detection ─────────────────────────────────────────────────────────

let opusStream = null;

async function redetectWithOpus() {
  if (!pageData) return;
  const btn = document.getElementById('opus-btn');
  btn.disabled = true;
  setStatus('Requesting Opus detection…');

  let r, j;
  try {
    r = await fetch(`${BASE}/run/redetect-opus/${encodeURIComponent(pageData.source_image)}`, { method: 'POST' });
    j = await r.json();
  } catch (e) {
    setStatus('Network error: ' + e);
    btn.disabled = false;
    return;
  }
  if (!j.ok) {
    setStatus('Failed: ' + (j.error || 'unknown'));
    btn.disabled = false;
    return;
  }

  setStatus('Detecting with Opus…');
  if (opusStream) { opusStream.close(); opusStream = null; }
  opusStream = new EventSource(`${BASE}/stream`);
  opusStream.onmessage = async function(e) {
    const data = e.data;
    if (data.startsWith('[DONE')) {
      opusStream.close(); opusStream = null;
      const ok = data.includes('status=done');
      if (ok) {
        setStatus('Opus done — refreshing areas…');
        try {
          const r2 = await fetch(`${BASE}/api/page/` + encodeURIComponent(pageData.source_image));
          pageData = await r2.json();
          selectedAreaIdx = -1;
          document.getElementById('info-id').textContent   = '—';
          document.getElementById('info-id').style.color   = '';
          document.getElementById('info-type').textContent = '';
          document.getElementById('delete-btn').style.display = 'none';
          document.getElementById('type-switcher').classList.remove('visible');
          const ib = document.getElementById('info-text');
          ib.value = ''; ib.placeholder = 'Click an area to see its text'; ib.readOnly = true;
          renderSVG();
          const acount = (pageData.areas || []).length;
          setStatus(acount + ' areas  ·  click area to inspect  ·  drag handles to edit');
        } catch (err) {
          setStatus('Refresh failed: ' + err);
        }
      } else {
        setStatus('Opus detection failed');
      }
      btn.disabled = false;
    }
  };
  opusStream.onerror = function() {
    if (opusStream) { opusStream.close(); opusStream = null; }
    setStatus('Stream error');
    btn.disabled = false;
  };
}

        setStatus('Sonnet detection failed');
      }
      btn.disabled = false;
    }
  };
  sonnetStream.onerror = function() {
    if (sonnetStream) { sonnetStream.close(); sonnetStream = null; }
    setStatus('Stream error');
    btn.disabled = false;
  };
}

// ── Info-text editing ─────────────────────────────────────────────────────────

const infoTextEl = document.getElementById('info-text');
infoTextEl.addEventListener('input', () => {
  if (selectedAreaIdx < 0 || !pageData) return;
  const area = pageData.areas[selectedAreaIdx];
  if (area.type === 'table') {
    area.table_html = infoTextEl.value || null;
    const frame = document.getElementById('table-preview-frame');
    frame.srcdoc = `<html><head><style>body{font-family:serif;font-size:12px;padding:4px;margin:0}table{border-collapse:collapse;width:100%}td,th{border:1px solid #999;padding:2px 4px}</style></head><body>${infoTextEl.value}</body></html>`;
  } else {
    area.text = infoTextEl.value || null;
  }
});
infoTextEl.addEventListener('blur', () => {
  if (selectedAreaIdx >= 0 && pageData) savePage();
});
infoTextEl.addEventListener('keydown', e => e.stopPropagation());

// ── Filmstrip auto-poll ───────────────────────────────────────────────────────

async function pollForNewPages() {
  try {
    const r = await fetch(`${BASE}/api/book`);
    if (!r.ok) return;
    const b = await r.json();
    const known = new Set(pages.map(p => p.name));
    const newPages = (b.pages || []).filter(p => !known.has(p.name));
    if (!newPages.length) return;

    const strip = document.getElementById('filmstrip');
    newPages.forEach(p => {
      const i = pages.length;
      pages.push(p);
      const num = p.name.replace(/\D/g, '').replace(/^0+/, '') || String(i + 1);
      const btn = document.createElement('button');
      btn.className = 'pg';
      btn.id        = 'pg' + i;
      btn.textContent = num;
      btn.onclick   = () => loadPage(i);
      if (p.prohibited)    btn.classList.add('prohibited');
      if (p.ignored)       btn.classList.add('ignored');
      if (p.process_later) btn.classList.add('process-later');
      strip.appendChild(btn);
    });

    setStatus(`+${newPages.length} new page${newPages.length > 1 ? 's' : ''} added to filmstrip`);
    setTimeout(() => {
      if (document.getElementById('status').textContent.startsWith('+')) setStatus('');
    }, 3000);
  } catch (_) {}
}

setInterval(pollForNewPages, 5_000);

init();
</script>
