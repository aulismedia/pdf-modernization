# Model priority for step 2 area detection.
#
# Format: [N] provider:model_id
#   provider  — gemini    → native Google Gemini API (GEMINI_API_KEY / GEMINI_PAID_KEY)
#               openrouter → any model via OpenRouter (OPEN_ROUTER_APIKEY)
#   model_id  — exact model string for that provider
#
# Comment a line with ## to disable it (e.g. after a 429 / quota exhaustion).
# The first active [N] entry is tried first; on failure the next is tried in order.
# [prohibited] is used only when content is blocked by a safety policy filter.

[1] gemini:gemini-3.1-flash-image-preview
[2] openrouter:google/gemini-3.1-flash-image-preview    # same model via OpenRouter
[3] openrouter:anthropic/claude-sonnet-4-5
[4] openrouter:anthropic/claude-opus-4-7
[prohibited] openrouter:qwen/qwen2.5-vl-72b-instruct
